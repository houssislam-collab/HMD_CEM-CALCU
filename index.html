<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designed by HMD - نظام حساب المعدلات</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // مكوّن الأيقونات لاستخدام مكتبة Lucide في المتصفح مباشرة
        const LucideIcon = ({ name, className }) => {
            useEffect(() => { window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const GradeCalculator = () => {
            const [view, setView] = useState('home');
            const [timer, setTimer] = useState({ days: 0, hours: 0, minutes: 0 });
            const [level, setLevel] = useState('1');
            const [tamazight, setTamazight] = useState(false);
            const [art, setArt] = useState(false);
            const [gpaData, setGpaData] = useState([]);
            const [bemData, setBemData] = useState([]);
            const [gpaResult, setGpaResult] = useState(null);
            const [bemResult, setBemResult] = useState(null);

            const subjects = {
                "1": [["عربية",2],["رياضيات",2],["فرنسية",1],["علوم فيزيائية",2],["اسلامية",1],["اجتماعيات",2],["مدنية",1],["انجليزية",1],["رياضة",1],["اعلام آلي",1]],
                "2": [["عربية",3],["رياضيات",3],["فرنسية",2],["علوم فيزيائية",2],["اسلامية",1],["اجتماعيات",2],["مدنية",1],["انجليزية",2],["رياضة",1],["اعلام آلي",1]],
                "3": [["عربية",3],["رياضيات",3],["فرنسية",2],["علوم فيزيائية",2],["اسلامية",1],["اجتماعيات",2],["مدنية",1],["انجليزية",2],["رياضة",1],["اعلام آلي",1]],
                "4": [["عربية",5],["رياضيات",4],["فرنسية",3],["علوم فيزيائية",2],["اسلامية",2],["اجتماعيات",3],["مدنية",1],["انجليزية",2],["رياضة",1],["اعلام آلي",1]]
            };

            useEffect(() => {
                const update = () => {
                    const diff = Math.max(0, new Date("June 8, 2026 08:00:00") - new Date());
                    setTimer({
                        days: Math.floor(diff / 86400000),
                        hours: Math.floor((diff % 86400000) / 3600000),
                        minutes: Math.floor((diff % 3600000) / 60000)
                    });
                };
                update();
                const interval = setInterval(update, 60000);
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (view === 'gpa') initGPA();
                else if (view === 'bem') initBEM();
            }, [view, level, tamazight, art]);

            const initGPA = () => {
                let list = [...subjects[level]];
                if (tamazight) list.push(["أمازيغية", 2]);
                if (art) list.push(["تربية فنية", 1]);
                setGpaData(list.map(([name, coef]) => ({ name, coef, eval: '', test: '', exam: '' })));
                setGpaResult(null);
            };

            const initBEM = () => {
                let list = [...subjects["4"], ["أمازيغية", 2]];
                setBemData(list.map(([name, coef]) => ({ name, coef, mark: '' })));
                setBemResult(null);
            };

            const calcGPA = () => {
                let total = 0, coefs = 0;
                gpaData.forEach(s => {
                    const avg = ((+s.eval || 0) + (+s.test || 0) + (+s.exam || 0) * 3) / 5;
                    total += avg * s.coef;
                    coefs += s.coef;
                });
                setGpaResult((total / coefs).toFixed(2));
            };

            const calcBEM = () => {
                let total = 0, coefs = 0;
                bemData.forEach(s => {
                    total += (+s.mark || 0) * s.coef;
                    coefs += s.coef;
                });
                setBemResult({ points: total.toFixed(2), coef: coefs, avg: (total / coefs).toFixed(2) });
            };

            const save = () => {
                localStorage.setItem('gpa', JSON.stringify({ level, tamazight, art, data: gpaData }));
                alert('✓ تم الحفظ');
            };

            const restore = () => {
                const saved = localStorage.getItem('gpa');
                if (saved) {
                    const d = JSON.parse(saved);
                    setLevel(d.level);
                    setTamazight(d.tamazight);
                    setArt(d.art);
                    setTimeout(() => setGpaData(d.data), 50);
                    alert('✓ تم الاسترجاع');
                } else alert('لا توجد بيانات');
            };

            if (view === 'home') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900 p-4 md:p-6 relative overflow-hidden" dir="rtl">
                        <div className="absolute inset-0 overflow-hidden pointer-events-none">
                            <div className="absolute top-20 left-20 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl animate-pulse"></div>
                            <div className="absolute bottom-20 right-20 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl animate-pulse" style={{ animationDelay: '1s' }}></div>
                        </div>

                        <div className="max-w-4xl mx-auto pt-4 md:pt-8 relative z-10">
                            <div className="text-center mb-8 md:mb-12">
                                <h1 className="text-3xl md:text-5xl font-bold bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 bg-clip-text text-transparent mb-2 md:mb-3">
                                    Designed by HMD
                                </h1>
                                <p className="text-gray-300 text-base md:text-lg">نظام حساب المعدلات الاحترافي</p>
                            </div>

                            <div className="bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-600 rounded-2xl md:rounded-3xl p-5 md:p-8 shadow-2xl mb-6 md:mb-8 backdrop-blur-xl border border-white/10">
                                <div className="flex items-center justify-center gap-2 md:gap-3 mb-4 md:mb-6">
                                    <LucideIcon name="clock" className="w-6 h-6 md:w-8 md:h-8 text-white" />
                                    <h2 className="text-white text-lg md:text-2xl font-bold">موعد بيام BEM 2026</h2>
                                </div>
                                <div className="grid grid-cols-3 gap-3 md:gap-4">
                                    {[{ l: 'يوم', v: timer.days }, { l: 'ساعة', v: timer.hours }, { l: 'دقيقة', v: timer.minutes }].map((t, i) => (
                                        <div key={i} className="bg-white/20 backdrop-blur-md rounded-2xl p-4 md:p-6 text-center border border-white/10">
                                            <div className="text-3xl md:text-5xl font-bold text-white mb-1 md:mb-2">{t.v}</div>
                                            <div className="text-white/90 text-sm md:text-base">{t.l}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-3 md:space-y-4">
                                {[
                                    { icon: 'calculator', title: 'المعدل الفصلي', desc: 'احسب معدلك الفصلي بدقة', color: 'indigo', page: 'gpa' },
                                    { icon: 'graduation-cap', title: 'معدل البيام', desc: 'احسب معدل شهادة التعليم المتوسط', color: 'pink', page: 'bem' },
                                    { icon: 'book-open', title: 'تطبيقاتنا', desc: 'مكتبة شاملة للدروس والفروض', color: 'cyan', page: 'apps' }
                                ].map((card, i) => (
                                    <button key={i} onClick={() => setView(card.page)}
                                        className="w-full bg-white/10 backdrop-blur-xl rounded-2xl md:rounded-3xl p-5 md:p-6 shadow-xl hover:shadow-2xl transition-all transform hover:-translate-y-1 border border-white/20 group hover:bg-white/15">
                                        <div className="flex items-center gap-4 md:gap-5 text-right">
                                            <div className={`bg-gradient-to-br from-${card.color}-500 to-${card.color}-600 p-4 md:p-5 rounded-2xl group-hover:scale-110 transition-transform flex-shrink-0 shadow-lg`}>
                                                <LucideIcon name={card.icon} className="w-7 h-7 md:w-9 md:h-9 text-white" />
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h3 className="text-lg md:text-2xl font-bold text-white mb-1">{card.title}</h3>
                                                <p className="text-gray-300 text-sm md:text-base">{card.desc}</p>
                                            </div>
                                            <LucideIcon name="arrow-right" className="w-6 h-6 md:w-7 md:h-7 text-gray-400 group-hover:text-white transition-colors flex-shrink-0" />
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'gpa') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900 p-4 md:p-6" dir="rtl">
                        <div className="max-w-6xl mx-auto pt-4 md:pt-8">
                            <button onClick={() => setView('home')} className="flex items-center gap-2 text-gray-300 hover:text-white mb-6 font-medium transition-colors">
                                <LucideIcon name="arrow-right" className="w-5 h-5" /><span>عودة</span>
                            </button>
                            <div className="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-4 md:p-8 border border-white/20">
                                <div className="flex items-center gap-3 mb-6">
                                    <LucideIcon name="calculator" className="w-7 h-7 md:w-8 md:h-8 text-indigo-400" />
                                    <h2 className="text-2xl md:text-3xl font-bold text-white">حساب المعدل الفصلي</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                                    <select value={level} onChange={(e) => setLevel(e.target.value)}
                                        className="p-3 bg-slate-800 border-2 border-white/20 rounded-xl text-white outline-none">
                                        <option value="1">1 متوسط</option>
                                        <option value="2">2 متوسط</option>
                                        <option value="3">3 متوسط</option>
                                        <option value="4">4 متوسط</option>
                                    </select>
                                    <label className="flex items-center justify-center gap-2 p-3 bg-indigo-500/20 rounded-xl cursor-pointer hover:bg-indigo-500/30 transition-colors border border-indigo-500/30">
                                        <input type="checkbox" checked={tamazight} onChange={(e) => setTamazight(e.target.checked)} className="w-5 h-5" />
                                        <span className="font-medium text-white">الأمازيغية</span>
                                    </label>
                                    <label className="flex items-center justify-center gap-2 p-3 bg-indigo-500/20 rounded-xl cursor-pointer hover:bg-indigo-500/30 transition-colors border border-indigo-500/30">
                                        <input type="checkbox" checked={art} onChange={(e) => setArt(e.target.checked)} className="w-5 h-5" />
                                        <span className="font-medium text-white">تربية فنية</span>
                                    </label>
                                </div>
                                <div className="overflow-x-auto rounded-xl border-2 border-white/20 mb-6">
                                    <table className="w-full min-w-[600px]">
                                        <thead className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white">
                                            <tr>
                                                <th className="p-3 md:p-4 text-center font-semibold">المادة</th>
                                                <th className="p-3 md:p-4 text-center font-semibold">تقويم</th>
                                                <th className="p-3 md:p-4 text-center font-semibold">فرض</th>
                                                <th className="p-3 md:p-4 text-center font-semibold">اختبار</th>
                                                <th className="p-3 md:p-4 text-center font-semibold">معامل</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white/5">
                                            {gpaData.map((s, i) => (
                                                <tr key={i} className="border-t border-white/10 hover:bg-white/10 transition-colors">
                                                    <td className="p-3 md:p-4 text-center font-medium text-white">{s.name}</td>
                                                    <td className="p-3 md:p-4 text-center"><input type="number" value={s.eval} onChange={(e) => { const d = [...gpaData]; d[i].eval = e.target.value; setGpaData(d); }} className="w-16 md:w-20 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none" placeholder="0" /></td>
                                                    <td className="p-3 md:p-4 text-center"><input type="number" value={s.test} onChange={(e) => { const d = [...gpaData]; d[i].test = e.target.value; setGpaData(d); }} className="w-16 md:w-20 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none" placeholder="0" /></td>
                                                    <td className="p-3 md:p-4 text-center"><input type="number" value={s.exam} onChange={(e) => { const d = [...gpaData]; d[i].exam = e.target.value; setGpaData(d); }} className="w-16 md:w-20 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none" placeholder="0" /></td>
                                                    <td className="p-3 md:p-4 text-center font-bold text-indigo-400">{s.coef}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
                                    <button onClick={calcGPA} className="md:col-span-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
                                        <LucideIcon name="trending-up" className="w-5 h-5" />احسب المعدل
                                    </button>
                                    <button onClick={save} className="bg-gradient-to-r from-green-600 to-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2">
                                        <LucideIcon name="save" className="w-5 h-5" />حفظ
                                    </button>
                                    <button onClick={restore} className="bg-gradient-to-r from-amber-600 to-orange-600 text-white font-bold py-3 rounded-xl shadow-lg flex items-center justify-center gap-2">
                                        <LucideIcon name="rotate-ccw" className="w-5 h-5" />استرجاع
                                    </button>
                                </div>
                                {gpaResult && (
                                    <div className="bg-gradient-to-r from-indigo-500/20 to-purple-500/20 rounded-2xl p-6 md:p-8 text-center border-2 border-indigo-500/30 backdrop-blur-xl">
                                        <p className="text-gray-300 text-lg mb-3">المعدل النهائي</p>
                                        <p className="text-5xl md:text-6xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">{gpaResult}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            if (view === 'bem') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-900 via-pink-900 to-purple-900 p-4 md:p-6" dir="rtl">
                        <div className="max-w-5xl mx-auto pt-4 md:pt-8">
                            <button onClick={() => setView('home')} className="flex items-center gap-2 text-gray-300 hover:text-white mb-6 font-medium transition-colors">
                                <LucideIcon name="arrow-right" className="w-5 h-5" /><span>عودة</span>
                            </button>
                            <div className="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-4 md:p-8 border border-white/20">
                                <div className="flex items-center gap-3 mb-6">
                                    <LucideIcon name="graduation-cap" className="w-7 h-7 md:w-8 md:h-8 text-pink-400" />
                                    <h2 className="text-xl md:text-3xl font-bold text-white">حساب معدل شهادة التعليم المتوسط</h2>
                                </div>
                                <div className="overflow-x-auto rounded-xl border-2 border-white/20 mb-6">
                                    <table className="w-full">
                                        <thead className="bg-gradient-to-r from-pink-600 to-purple-600 text-white">
                                            <tr>
                                                <th className="p-3 md:p-4 text-center font-semibold">المادة</th>
                                                <th className="p-3 md:p-4 text-center font-semibold">العلامة</th>
                                                <th className="p-3 md:p-4 text-center font-semibold">المعامل</th>
                                                <th className="p-3 md:p-4 text-center font-semibold">المجموع</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white/5">
                                            {bemData.map((s, i) => (
                                                <tr key={i} className="border-t border-white/10 hover:bg-white/10 transition-colors">
                                                    <td className="p-3 md:p-4 text-center font-medium text-white">{s.name}</td>
                                                    <td className="p-3 md:p-4 text-center"><input type="number" value={s.mark} onChange={(e) => { const d = [...bemData]; d[i].mark = e.target.value; setBemData(d); }} className="w-20 md:w-24 p-2 bg-white/10 border-2 border-white/20 rounded-lg text-center text-white outline-none" placeholder="0" /></td>
                                                    <td className="p-3 md:p-4 text-center font-bold text-pink-400">{s.coef}</td>
                                                    <td className="p-3 md:p-4 text-center font-bold text-white">{((+s.mark || 0) * s.coef).toFixed(2)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <button onClick={calcBEM} className="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 mb-6">
                                    <LucideIcon name="trending-up" className="w-5 h-5" />احسب النتيجة النهائية
                                </button>
                                {bemResult && (
                                    <div className="bg-gradient-to-r from-pink-500/20 to-purple-500/20 rounded-2xl p-6 md:p-8 border-2 border-pink-500/30 backdrop-blur-xl">
                                        <div className="grid grid-cols-3 gap-4 text-center">
                                            <div><p className="text-gray-300 text-sm mb-2">المجموع</p><p className="text-3xl font-bold text-pink-400">{bemResult.points}</p></div>
                                            <div><p className="text-gray-300 text-sm mb-2">المعاملات</p><p className="text-3xl font-bold text-pink-400">{bemResult.coef}</p></div>
                                            <div><p className="text-gray-300 text-sm mb-2">المعدل</p><p className="text-3xl font-bold bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent">{bemResult.avg}</p></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-cyan-900 to-purple-900 p-4 md:p-6" dir="rtl">
                    <div className="max-w-3xl mx-auto pt-4 md:pt-8">
                        <button onClick={() => setView('home')} className="flex items-center gap-2 text-gray-300 hover:text-white mb-6 font-medium transition-colors">
                            <LucideIcon name="arrow-right" className="w-5 h-5" /><span>عودة</span>
                        </button>
                        <div className="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-6 md:p-8 border border-white/20">
                            <div className="flex items-center gap-3 mb-8">
                                <LucideIcon name="book-open" className="w-7 h-7 md:w-8 md:h-8 text-cyan-400" />
                                <h2 className="text-2xl md:text-3xl font-bold text-white">تطبيقات HMD</h2>
                            </div>
                            <div className="bg-gradient-to-r from-cyan-500/20 to-purple-500/20 rounded-2xl p-8 text-center border-2 border-cyan-500/30 backdrop-blur-xl">
                                <LucideIcon name="book-open" className="w-16 h-16 text-cyan-300 mx-auto mb-6" />
                                <p className="text-white text-xl md:text-2xl font-semibold mb-2">قريباً جداً</p>
                                <p className="text-gray-300">بنك الفروض والدروس للمتوسط</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<GradeCalculator />);
    </script>
</body>
</html>
